spring:
  application:
    name: runing
  
  datasource:
    url: jdbc:postgresql://localhost:5432/runing
    username: runing_user
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: 1800000
  refresh-token-expire-time: 1209600000