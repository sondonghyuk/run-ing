spring:
  application:
    name: runing
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/runing
    username: runing_user
    password: ${DB_PASSWORD}
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: 1800000
  refresh-token-expire-time: 1209600000